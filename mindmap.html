<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mindmap Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

:root{
--node-size:16px;
--node-padding:12px;
--line-color:#444;
--line-width:2;
}

body{
font-family:'Segoe UI',system-ui;
background:#cbd2d9;
margin:0;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
}

.main-controls{
background:white;
padding:12px 20px;
border-radius:50px;
box-shadow:0 4px 20px rgba(0,0,0,0.15);
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
margin-bottom:10px;
position:sticky;
top:10px;
z-index:1000;
}

.divider{border-left:2px solid #ccc;margin:0 5px;height:20px;display:inline-block;vertical-align:middle;}

.btn{
padding:8px 18px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
transition:0.15s;
}

.btn:hover{filter:brightness(1.08);}
.btn-settings{background:#6c757d;color:white}

.hint{
color:#666;
font-size:12px;
margin-bottom:15px;
text-align:center;
max-width:700px;
}

#settings-menu{
display:none;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,0.2);
margin-bottom:15px;
gap:15px;
flex-wrap:wrap;
justify-content:center;
}

.setting-group{
display:flex;
flex-direction:column;
gap:4px;
font-size:10px;
font-weight:bold;
color:#444;
text-transform:uppercase;
}

.setting-group input,.setting-group select{
padding:4px;
border:1px solid #ccc;
border-radius:4px;
}

#header-editor{
display:none;
position:absolute;
background:#222;
color:white;
padding:10px;
border-radius:8px;
gap:10px;
z-index:2000;
box-shadow:0 4px 15px rgba(0,0,0,0.4);
align-items:center;
}
#header-editor button,#header-editor input{
background:#444;
border:none;
color:white;
padding:5px 10px;
cursor:pointer;
border-radius:4px;
}

#preview-viewport{
width:100%;
max-width:1100px;
overflow:auto;
display:flex;
justify-content:center;
}

/* EXPORT AREA */

#export-area{
background:white;
position:relative;
box-shadow:0 0 50px rgba(0,0,0,0.2);
width:1100px;
height:650px;
overflow:hidden;
flex-shrink:0;
}

.grid{
background-image:
linear-gradient(#eee 1px, transparent 1px),
linear-gradient(90deg,#eee 1px, transparent 1px);
background-size:40px 40px;
}

#title-el{
position:relative;
z-index:2;
font-size:2.5em;
margin:20px;
outline:none;
}

#canvas{
transform-origin:0 0;
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
cursor:default;
}

#connections{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:visible;
}

#select-box{
position:absolute;
border:1px dashed #2c3e50;
background:rgba(44,62,80,0.08);
pointer-events:none;
z-index:5;
}

.node{
position:absolute;
background:#4472C4;
color:white;
padding:var(--node-padding);
border-radius:10px;
font-size:var(--node-size);
cursor:grab;
min-width:80px;
text-align:center;
user-select:none;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
border:1px solid rgba(0,0,0,0.15);
outline:none;
}

.node:active{cursor:grabbing;}

.node.selected{
outline:3px solid #2c3e50;
outline-offset:3px;
}

#context-menu{
position:absolute;
display:none;
gap:6px;
flex-wrap:wrap;
max-width:300px;
z-index:3000;
}

#context-menu .btn{
padding:7px 14px;
font-size:13px;
box-shadow:0 3px 10px rgba(0,0,0,0.3);
}

#color-picker{
position:absolute;
background:white;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
padding:10px;
display:none;
grid-template-columns:repeat(4,30px);
gap:8px;
z-index:3000;
}

.color{
width:30px;
height:30px;
border-radius:6px;
cursor:pointer;
border:2px solid transparent;
}
.color:hover{border-color:#333;}

.footer-note{
position:absolute;
bottom:10px;
right:20px;
font-size:12px;
color:#999;
z-index:2;
}

</style>
</head>

<body>

<div class="main-controls">
<span style="color:#555;font-weight:bold;">Andere Tools:</span>
<button class="btn" style="background:#4472C4;color:white;" onclick="window.open('https://jasonnewacc.github.io/zeitstrahl.github.io/main','_blank')">Zeitstrahl</button>
<button class="btn" style="background:#77bee7; color:white; min-width:100px;" onclick="window.open('https://jasonnewacc.github.io/zeitstrahl.github.io/diagram', '_Blank')" onmouseout="this.innerText='Diagramm'">Diagramm</button>


<span class="divider"></span>

<button class="btn" onclick="addRootNode()" style="background:#4472C4;color:white">+ Neues Thema</button>
<button class="btn" onclick="autoLayout()" style="background:#34495E;color:white">Anordnen</button>
<button class="btn" onclick="downloadPDF()" style="background:#28a745;color:white">Export PDF</button>
<button class="btn btn-settings" onclick="toggleSettings()">⚙️</button>
</div>

<div class="hint">Rechtsklick für Optionen · Shift+Klick oder Ziehen auf freier Fläche für Mehrfachauswahl · Tab = neuer Ast, Enter = neues Geschwister · Mausrad zum Zoomen</div>

<div id="settings-menu">

<div class="setting-group">
<label>Größe BxH</label>
<div style="display:flex;gap:4px;">
<input type="number" id="wSet" value="1100" style="width:55px;" oninput="apply()">
<input type="number" id="hSet" value="650" style="width:55px;" oninput="apply()">
</div>
</div>

<div class="setting-group">
<label>Schrift / Padding</label>
<div style="display:flex;gap:4px;">
<input type="number" id="sizeSet" value="16" style="width:45px;" oninput="apply()">
<input type="number" id="padSet" value="12" style="width:45px;" oninput="apply()">
</div>
</div>

<div class="setting-group">
<label>Linienfarbe / -stärke</label>
<div style="display:flex;gap:4px;">
<input type="color" id="lineColorSet" value="#444444" oninput="apply()">
<input type="number" id="lineWidthSet" value="2" style="width:35px;" oninput="apply()">
</div>
</div>

<div class="setting-group">
<label>Optionen</label>
<label style="text-transform:none;font-weight:normal;font-size:13px;">
<input type="checkbox" id="gridSet" onchange="apply()"> Raster anzeigen
</label>
</div>

</div>

<div id="header-editor">
<input type="number" id="headSizeIn" value="40" style="width:50px" oninput="formatTitle('fontSize', this.value + 'px')">
<button onclick="formatTitle('underline')"><u>U</u></button>
<button onclick="formatTitle('justifyLeft')">⬅</button>
<button onclick="formatTitle('justifyCenter')">Mitte</button>
<button onclick="formatTitle('justifyRight')">➡</button>
</div>

<div id="preview-viewport">

<div id="export-area">

<h1 id="title-el" contenteditable="true" onfocus="showTitleEditor(event)">Meine Mindmap</h1>

<div id="canvas">

<svg id="connections"></svg>

<div id="mindmap"></div>

</div>

<div class="footer-note">erstellt mit https://jasonnewacc.github.io/zeitstrahl.github.io/mindmap</div>

</div>

</div>

<div id="context-menu"></div>

<div id="color-picker"></div>

<script>

let nodes=[]
let activeNode=null
let selectedNodes=new Set()
let scale=1
let panX=0
let panY=0
let lastMenuX=400
let lastMenuY=300
let nodeCounter=0

const viewport=document.getElementById("preview-viewport")
const canvas=document.getElementById("canvas")
const area=document.getElementById("export-area")
const menu=document.getElementById("context-menu")
const picker=document.getElementById("color-picker")

/* SETTINGS */

function toggleSettings(){
const m=document.getElementById("settings-menu")
m.style.display=m.style.display==="flex"?"none":"flex"
}

function apply(){

document.documentElement.style
.setProperty("--node-size",
document.getElementById("sizeSet").value+"px")

document.documentElement.style
.setProperty("--node-padding",
document.getElementById("padSet").value+"px")

document.documentElement.style
.setProperty("--line-color",
document.getElementById("lineColorSet").value)

document.documentElement.style
.setProperty("--line-width",
document.getElementById("lineWidthSet").value)

area.style.width=document.getElementById("wSet").value+"px"
area.style.height=document.getElementById("hSet").value+"px"

if(document.getElementById("gridSet").checked)
canvas.classList.add("grid")
else
canvas.classList.remove("grid")

drawLines()

}

function showTitleEditor(e){
const editor=document.getElementById("header-editor")
const rect=e.target.getBoundingClientRect()
editor.style.display="flex"
editor.style.left=rect.left+"px"
editor.style.top=(rect.bottom+window.scrollY+5)+"px"
}

function formatTitle(cmd,val=null){
if(cmd==="fontSize") document.getElementById("title-el").style.fontSize=val
else document.execCommand(cmd,false,val)
}

document.addEventListener("mousedown",(e)=>{
if(!e.target.closest("#header-editor") && !e.target.closest("#title-el"))
document.getElementById("header-editor").style.display="none"
})

function toCanvasCoords(pageX,pageY){
const rect=canvas.getBoundingClientRect()
return {
x:(pageX-rect.left)/scale,
y:(pageY-rect.top)/scale
}
}

function updateSelectionVisuals(){
nodes.forEach(n=>n.el.classList.toggle("selected",selectedNodes.has(n.id)))
}

function clearSelection(){
selectedNodes.clear()
updateSelectionVisuals()
}

function createNode(x=400,y=300,parent=null,text="Thema"){

const node={
id:Date.now()+"_"+(nodeCounter++),
text:text,
x:x,
y:y,
parent:parent,
color:"#4472C4"
}

nodes.push(node)

renderNode(node)

return node

}

function addRootNode(){
// neues, unverbundenes Thema in der Mitte des sichtbaren Bereichs anlegen
const rect=viewport.getBoundingClientRect()
const centerX=rect.left+rect.width/2
const centerY=rect.top+rect.height/2
const pos=toCanvasCoords(centerX,centerY)
// kleiner Zufalls-Versatz, damit sich mehrere neue Themen nicht exakt überlappen
const jitter=()=>(Math.random()-0.5)*80
const n=createNode(pos.x+jitter(),pos.y+jitter())
focusNode(n)
}

function spawnChild(parent){
if(!parent)return
const siblingCount=nodes.filter(n=>n.parent===parent.id).length
const child=createNode(parent.x+170,parent.y+siblingCount*75,parent.id,"Neuer Ast")
focusNode(child)
}

function spawnSibling(node){
if(!node)return
if(!node.parent){addRootNode();return}
const parent=nodes.find(n=>n.id===node.parent)
spawnChild(parent)
}

function focusNode(node){
node.el.focus()
const range=document.createRange()
range.selectNodeContents(node.el)
const sel=window.getSelection()
sel.removeAllRanges()
sel.addRange(range)
}

function renderNode(node){

const el=document.createElement("div")

el.className="node"
el.innerText=node.text
el.contentEditable=true
el.spellcheck=false
el.style.left=node.x+"px"
el.style.top=node.y+"px"
el.style.background=node.color

node.el=el

enableDrag(el,node)

el.addEventListener("blur",()=>node.text=el.innerText)

el.addEventListener("keydown",(e)=>{
if(e.key==="Tab"){
e.preventDefault()
spawnChild(node)
}else if(e.key==="Enter" && !e.shiftKey){
e.preventDefault()
spawnSibling(node)
}
})

el.addEventListener("contextmenu",(e)=>{
e.preventDefault()
e.stopPropagation()
activeNode=node
if(!selectedNodes.has(node.id)){
selectedNodes.clear()
selectedNodes.add(node.id)
updateSelectionVisuals()
}
openMenu(e.pageX,e.pageY)
})

document.getElementById("mindmap").appendChild(el)

drawLines()

}


function enableDrag(el,node){

let startX,startY,origX,origY,dragging=false,moved=false

el.addEventListener("mousedown",(e)=>{
if(e.button!==0)return
e.stopPropagation()

if(e.shiftKey){
if(selectedNodes.has(node.id))selectedNodes.delete(node.id)
else selectedNodes.add(node.id)
updateSelectionVisuals()
return
}

if(!selectedNodes.has(node.id)){
selectedNodes.clear()
updateSelectionVisuals()
}

dragging=true
moved=false
startX=e.pageX
startY=e.pageY
origX=node.x
origY=node.y
})

document.addEventListener("mousemove",(e)=>{

if(!dragging)return

const dx=(e.pageX-startX)/scale
const dy=(e.pageY-startY)/scale

if(!moved && Math.hypot(e.pageX-startX,e.pageY-startY)<4)return

if(!moved){
moved=true
el.blur()
}

node.x=origX+dx
node.y=origY+dy

el.style.left=node.x+"px"
el.style.top=node.y+"px"

drawLines()

})

document.addEventListener("mouseup",()=>{dragging=false})

}


canvas.addEventListener("mousedown",(e)=>{

if(e.button!==0)return
if(e.target.closest(".node"))return

const additive=e.shiftKey
const preSelection=additive?new Set(selectedNodes):new Set()
if(!additive)clearSelection()

const start=toCanvasCoords(e.pageX,e.pageY)
let moved=false
const box=document.createElement("div")
box.id="select-box"
canvas.appendChild(box)

function onMove(e2){

const cur=toCanvasCoords(e2.pageX,e2.pageY)

if(!moved && Math.hypot(e2.pageX-e.pageX,e2.pageY-e.pageY)<4)return
moved=true

const left=Math.min(start.x,cur.x)
const top=Math.min(start.y,cur.y)
const width=Math.abs(cur.x-start.x)
const height=Math.abs(cur.y-start.y)

box.style.left=left+"px"
box.style.top=top+"px"
box.style.width=width+"px"
box.style.height=height+"px"

selectedNodes=new Set(preSelection)

nodes.forEach(n=>{
const w=n.el.offsetWidth||100
const h=n.el.offsetHeight||40
const intersects=!(n.x+w<left || n.x>left+width || n.y+h<top || n.y>top+height)
if(intersects)selectedNodes.add(n.id)
})

updateSelectionVisuals()

}

function onUp(){
document.removeEventListener("mousemove",onMove)
document.removeEventListener("mouseup",onUp)
box.remove()
}

document.addEventListener("mousemove",onMove)
document.addEventListener("mouseup",onUp)

})


function drawLines(){

const svg=document.getElementById("connections")
svg.innerHTML=""

nodes.forEach(n=>{

if(!n.parent)return

const p=nodes.find(x=>x.id===n.parent)

if(!p)return

const line=document.createElementNS("http://www.w3.org/2000/svg","line")

line.setAttribute("x1",p.x+p.el.offsetWidth/2)
line.setAttribute("y1",p.y+p.el.offsetHeight/2)
line.setAttribute("x2",n.x+n.el.offsetWidth/2)
line.setAttribute("y2",n.y+n.el.offsetHeight/2)

line.setAttribute("stroke",
getComputedStyle(document.documentElement)
.getPropertyValue("--line-color"))

line.setAttribute("stroke-width",
getComputedStyle(document.documentElement)
.getPropertyValue("--line-width"))

svg.appendChild(line)

})

}

function addMenuBtn(label,color,fn){
const b=document.createElement("button")
b.className="btn"
b.style.background=color
b.style.color="white"
b.innerText=label
b.onclick=(e)=>{
e.stopPropagation()
fn()
menu.style.display="none"
}
menu.appendChild(b)
}

function openMenu(x,y){

lastMenuX=x
lastMenuY=y

menu.innerHTML=""
const n=selectedNodes.size

if(n>1){
addMenuBtn("Farbe ("+n+")","#9B59B6",openColor)
addMenuBtn("Löschen ("+n+")","#E74C3C",deleteSelected)
addMenuBtn("Auswahl aufheben","#6c757d",clearSelection)
}else{
addMenuBtn("+ Thema","#4472C4",handleNewTopic)
if(n===1 || activeNode){
addMenuBtn("+ Ast","#28a745",()=>spawnChild(activeNode))
addMenuBtn("Farbe","#9B59B6",openColor)
addMenuBtn("Löschen","#E74C3C",deleteSelected)
}
}

menu.style.left=x+"px"
menu.style.top=y+"px"
menu.style.display="flex"

}

area.addEventListener("contextmenu",(e)=>{
if(e.target.closest(".node"))return
e.preventDefault()
if(selectedNodes.size<=1)activeNode=null
openMenu(e.pageX,e.pageY)
})

document.addEventListener("click",()=>{
menu.style.display="none"
picker.style.display="none"
})

function handleNewTopic(){
const pos=toCanvasCoords(lastMenuX,lastMenuY)
const n=createNode(pos.x,pos.y)
focusNode(n)
}


function deleteSelected(){

const ids=selectedNodes.size>0
? new Set(selectedNodes)
: (activeNode?new Set([activeNode.id]):new Set())

if(ids.size===0)return

let changed=true
while(changed){
changed=false
nodes.forEach(n=>{
if(n.parent && ids.has(n.parent) && !ids.has(n.id)){
ids.add(n.id)
changed=true
}
})
}

nodes.forEach(n=>{if(ids.has(n.id))n.el.remove()})
nodes=nodes.filter(n=>!ids.has(n.id))

selectedNodes.clear()
activeNode=null

drawLines()

}

document.addEventListener("keydown",(e)=>{

const editing=document.activeElement && document.activeElement.classList
&& document.activeElement.classList.contains("node")

if((e.key==="Delete"||e.key==="Backspace") && !editing && selectedNodes.size>0){
e.preventDefault()
deleteSelected()
}

if(e.key==="Escape"){
clearSelection()
if(document.activeElement)document.activeElement.blur()
}

})


function autoLayout(){

const levelGapX=220
const siblingGapY=90
let cursorY=60

function layout(node,depth){
const children=nodes.filter(n=>n.parent===node.id)
node.x=80+depth*levelGapX
if(children.length===0){
node.y=cursorY
cursorY+=siblingGapY
}else{
children.forEach(c=>layout(c,depth+1))
node.y=(children[0].y+children[children.length-1].y)/2
}
}

nodes.filter(n=>!n.parent).forEach(r=>layout(r,0))

nodes.forEach(n=>{
n.el.style.left=n.x+"px"
n.el.style.top=n.y+"px"
})

drawLines()

}


const colors=[
"#4472C4","#E74C3C","#2ECC71","#F39C12",
"#9B59B6","#1ABC9C","#34495E","#95A5A6"
]

colors.forEach(c=>{

const div=document.createElement("div")

div.className="color"
div.style.background=c

div.onclick=(e)=>{
e.stopPropagation()
const ids=selectedNodes.size>0
? selectedNodes
: (activeNode?new Set([activeNode.id]):new Set())
nodes.forEach(n=>{
if(ids.has(n.id)){
n.color=c
n.el.style.background=c
}
})
picker.style.display="none"
}

picker.appendChild(div)

})

function openColor(){
picker.style.display="grid"
picker.style.left=lastMenuX+"px"
picker.style.top=lastMenuY+"px"
}


viewport.addEventListener("wheel",(e)=>{

e.preventDefault()

const rect=viewport.getBoundingClientRect()
const mouseX=e.pageX-rect.left-viewport.scrollLeft
const mouseY=e.pageY-rect.top-viewport.scrollTop

const prevScale=scale
scale+=e.deltaY*-0.001
scale=Math.min(Math.max(.4,scale),2.5)

panX=mouseX-(mouseX-panX)*(scale/prevScale)
panY=mouseY-(mouseY-panY)*(scale/prevScale)

canvas.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`

},{passive:false})

function downloadPDF(){

const w=parseInt(document.getElementById("wSet").value)
const h=parseInt(document.getElementById("hSet").value)

html2pdf().set({
margin:0,
filename:"mindmap.pdf",
html2canvas:{scale:2,useCORS:true},
jsPDF:{unit:"px",format:[w,h],orientation:"landscape"}
}).from(area).save()

}

createNode(460,280,null,"Hauptthema")

</script>

</body>
</html>
