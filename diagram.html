<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Diagramm Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --accent-color: #4472C4;
            --accent-weight: 4px;
            --label-size: 16px;
            --value-size: 16px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            background: #4472C4;
            color: white;
        }   

        .btn:hover {
            background: #365f9f;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #cbd2d9; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        #type-picker {
            margin-top: 60px; text-align: center;
        }
        #type-picker p { color: #444; font-weight: bold; margin-bottom: 15px; }
        .type-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .type-buttons .btn { padding: 12px 24px; font-size: 1em; }

        .main-controls {
            background: white; padding: 12px 20px; border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            margin-bottom: 15px; position: sticky; top: 10px; z-index: 1000;
        }

        .input-box { padding: 8px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        select.input-box { cursor: pointer; }
        .btn { padding: 8px 18px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: #4472C4; color: white; }

        #header-editor {
            display: none; position: absolute; background: #222; color: white;
            padding: 10px; border-radius: 8px; gap: 10px; z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); align-items: center;
        }
        #header-editor button, #header-editor input { background: #444; border: none; color: white; padding: 5px 10px; cursor: pointer; border-radius: 4px; }

        #settings-menu {
            display: none; background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); margin-bottom: 15px;
            gap: 15px; flex-wrap: wrap; justify-content: center;
        }
        .setting-group { display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: bold; color: #444; text-transform: uppercase; }
        .setting-group input, .setting-group select { padding: 4px; border: 1px solid #ccc; border-radius: 4px; }

        #export-area {
            background: white; padding: 60px 80px; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.2);
            width: 1100px; min-height: 650px; box-sizing: border-box; overflow: visible;
        }

        #title-el { font-size: 2.5em; margin-bottom: 30px; outline: none; }

        #chart-area { position: relative; width: 100%; height: 400px; box-sizing: border-box; }

        .gridline { position: absolute; left: 0; right: 0; height: 1px; background: #eee; }

        #bars-row {
            position: absolute; left: 0; right: 0; bottom: 0; top: 0;
            display: flex; align-items: flex-end; justify-content: center;
            border-bottom: var(--accent-weight) solid var(--accent-color);
        }
        .bar-cluster { display: flex; align-items: flex-end; justify-content: space-evenly; height: 100%; flex: 1; }
        .group-divider { align-self: stretch; width: 2px; background: #ccc; margin: 0 22px; flex-shrink: 0; }
        .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; flex: 1; max-width: 140px; }
        .bar-value { font-size: var(--value-size); font-weight: bold; margin-bottom: 4px; outline: none; color: #333; }
        .bar { width: 60%; max-width: 70px; border-radius: 6px 6px 0 0; transition: height 0.2s; cursor: pointer; }

        #axis-labels { display: flex; justify-content: center; margin-top: 10px; }
        .axis-cluster { display: flex; flex-direction: column; flex: 1; }
        .axis-cluster-row { display: flex; justify-content: space-evenly; }
        .axis-divider-spacer { width: 2px; margin: 0 22px; flex-shrink: 0; }
        .group-title { font-weight: bold; text-align: center; margin-top: 6px; font-size: calc(var(--label-size) + 2px); color: #333; }
        .axis-col { flex: 1; max-width: 140px; display: flex; justify-content: center; }
        .axis-label { font-size: var(--label-size); outline: none; white-space: nowrap; padding: 4px; border-radius: 4px; }
        .axis-labels-horizontal .axis-label { transform: none; }
        .axis-labels-schraeg .axis-label { transform: rotate(-40deg); transform-origin: top right; margin-top: 6px; }
        .axis-labels-hochkant .axis-label { writing-mode: vertical-rl; transform: rotate(180deg); margin-top: 6px; }

        /* Kurvendiagramm */
        #line-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
        .line-point {
            position: absolute; width: 14px; height: 14px; border-radius: 50%;
            background: white; border: 3px solid var(--accent-color); transform: translate(-50%, -50%);
            cursor: pointer; z-index: 5;
        }
        .line-value {
            position: absolute; transform: translate(-50%, -130%); font-size: var(--value-size);
            font-weight: bold; outline: none; color: #333; white-space: nowrap; padding: 2px 4px; border-radius: 4px;
        }

        #pie-wrapper { display: flex; align-items: center; justify-content: center; gap: 60px; height: 100%; }
        #pie-visual { width: 280px; height: 280px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        #pie-legend { display: flex; flex-direction: column; gap: 12px; }
        .legend-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .legend-swatch { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
        .legend-label { font-size: var(--label-size); outline: none; font-weight: bold; padding: 2px 4px; border-radius: 4px; min-width: 80px; }
        .legend-value { font-size: var(--value-size); outline: none; color: #666; padding: 2px 4px; border-radius: 4px; }
        .legend-pct { font-size: 0.8em; color: #999; }
        #pie-visual { position: relative; }
        .pie-value {
            position: absolute; transform: translate(-50%, -50%);
            font-size: var(--value-size); font-weight: bold; color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.65);
            pointer-events: none; white-space: nowrap;
        }
        #pie-total-info {
            margin-top: 8px; font-size: 12px; color: #777; text-align: center;
        }
        .percentage-input { display: none; }

        .limit-exceeded { background: #fff1f1; border: 1px solid red; }

        @media print { .main-controls, #settings-menu, #header-editor, #type-picker { display: none !important; } }
    </style>
</head>
<body>

<div id="type-picker">
    <p>Wähle einen Diagrammtyp aus, um zu starten</p>
    <div class="type-buttons">
        <button class="btn" style="background:#28a745; color:white;" onclick="selectType('bar')">Balkendiagramm</button>
        <button class="btn" style="background:#77bee7; color:white;" onclick="selectType('line')">Kurvendiagramm</button>
        <button class="btn" style="background:#f39c12; color:white;" onclick="selectType('pie')">Klassisches Diagramm</button>
    </div>
</div>

<div class="main-controls" style="display:none;">
    <span style="color: #555; font-weight: bold; margin-right: 5px;">Andere Tools:</span>
    <button class="btn" style="background:#4472C4; color:white; min-width: 90px;" onclick="window.open('https://jasonnewacc.github.io/zeitstrahl.github.io/main','_blank')">Zeitstrahl</button>
    <button class="btn" style="background:#cc545e; color:white; min-width: 90px;" onclick="window.open('https://jasonnewacc.github.io/zeitstrahl.github.io/mindmap','_blank')">Mind Map</button>

    <span style="border-left: 2px solid #ccc; margin: 0 15px; height: 20px; display: inline-block; vertical-align: middle;"></span>

    <select id="typeSelect" class="input-box" onchange="switchType(this.value)">
        <option value="bar">Balkendiagramm</option>
        <option value="line">Kurvendiagramm</option>
        <option value="pie">Klassisches Diagramm</option>
    </select>

    <input type="text" id="labelIn" class="input-box" placeholder="Beschriftung" style="width: 150px;">
    <input type="text" id="valueIn" class="input-box" placeholder="Wert" style="width: 90px;" onkeydown="if(event.key==='Enter') addPoint()">
    <input type="text" id="percentIn" class="input-box percentage-input" placeholder="Prozent (z.B. 25)" style="width: 120px;" onkeydown="if(event.key==='Enter') addPoint()">
    <input type="text" id="groupIn" class="input-box" placeholder="Gruppe, z.B. 2008 (optional)" style="width: 170px; display:none;" onkeydown="if(event.key==='Enter') addPoint()">

    <button class="btn btn-add" onclick="addPoint()">Hinzufügen</button>
    <button class="btn" style="background:#f39c12; color:white" onclick="sortPoints()">Sortieren</button>
    <button class="btn" style="background:#28a745; color:white" onclick="downloadPDF()">Export PDF</button>
    <button class="btn" style="background:#6c757d; color:white" onclick="toggleSettings()">⚙️</button>
</div>

<div id="settings-menu">
    <div class="setting-group"><label>Größe BxH</label><div style="display:flex;gap:4px;"><input type="number" id="wSet" value="1100" style="width:55px;" oninput="applyAllSettings()"><input type="number" id="hSet" value="650" style="width:55px;" oninput="applyAllSettings()"></div></div>
    <div class="setting-group"><label>Schrift Label/Wert</label><div style="display:flex;gap:4px;"><input type="number" id="labelSizeSet" value="16" style="width:45px;" oninput="applyAllSettings()"><input type="number" id="valueSizeSet" value="16" style="width:45px;" oninput="applyAllSettings()"></div></div>
    <div class="setting-group"><label>Farbe/Dicke</label><div style="display:flex;gap:4px;"><input type="color" id="colorSet" value="#4472C4" oninput="applyAllSettings()"><input type="number" id="weightSet" value="4" style="width:35px;" oninput="applyAllSettings()"></div></div>
    <div class="setting-group" id="orientGroup"><label>Balken-Beschriftung</label>
        <select id="orientSet" onchange="applyAllSettings()">
            <option value="horizontal" selected>Gerade</option>
            <option value="schraeg">Schräg</option>
            <option value="hochkant" >Hochkant</option>
        </select>
    </div>
    <div class="setting-group"><label>Optionen</label>
        <div style="display:flex; gap:10px;">
            <label><input type="checkbox" id="titleShowSet" checked onchange="applyAllSettings()"> Titel</label>
            <label><input type="checkbox" id="valLabelSet" checked onchange="applyAllSettings()"> Werte</label>
            <label id="pieInsideGroup"><input type="checkbox" id="pieInsideSet" onchange="applyAllSettings()"> Werte im Kreis</label>
            <label><input type="checkbox" id="gridSet" checked onchange="applyAllSettings()"> Gitter</label>
            <label><input type="checkbox" id="multiColorSet" checked onchange="applyAllSettings()"> Mehrfarbig</label>
        </div>
    </div>
</div>

<div id="header-editor">
    <input type="number" id="headSizeIn" value="40" style="width:50px" oninput="formatTitle('fontSize', this.value + 'px')">
    <button onclick="formatTitle('underline')"><u>U</u></button>
    <button onclick="formatTitle('justifyLeft')">⬅</button>
    <button onclick="formatTitle('justifyCenter')">Center</button>
    <button onclick="formatTitle('justifyRight')">➡</button>
</div>

<div id="export-area" style="display:none;">
    <h1 id="title-el" contenteditable="true" onfocus="showTitleEditor(event)">Mein Diagramm</h1>
    <div id="chart-area"></div>
    <div id="footer-text" style="position:absolute; bottom:20px; right:40px; font-size:12px; color:#999;">erstellt mit https://jasonnewacc.github.io/zeitstrahl.github.io/diagram</div>
</div>

<script>
    const PALETTE = ['#4472C4', '#ED7D31', '#A5A5A5', '#FFC000', '#5B9BD5', '#70AD47', '#264478', '#9E480E'];
    let dataPoints = [];
    let currentType = 'bar';
    let activeIdx = -1;

    function selectType(type) {
        currentType = type;
        document.getElementById('type-picker').style.display = 'none';
        document.querySelector('.main-controls').style.display = 'flex';
        document.getElementById('export-area').style.display = 'block';
        document.getElementById('typeSelect').value = type;
        applyAllSettings();
    }

    function updateInputMode() {
        const valueIn = document.getElementById('valueIn');
        const percentIn = document.getElementById('percentIn');
        const pieInsideGroup = document.getElementById('pieInsideGroup');
        const groupIn = document.getElementById('groupIn');

        const isPie = currentType === 'pie';
        valueIn.style.display = isPie ? 'none' : 'inline-block';
        percentIn.style.display = isPie ? 'inline-block' : 'none';
        pieInsideGroup.style.display = isPie ? 'inline-block' : 'none';
        groupIn.style.display = currentType === 'bar' ? 'inline-block' : 'none';
    }

    function switchType(type) {
        currentType = type;
        updateInputMode();
        render();
    }

    function toggleSettings() {
        const s = document.getElementById('settings-menu');
        s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
    }

    function showTitleEditor(e) {
        const editor = document.getElementById('header-editor');
        const rect = e.target.getBoundingClientRect();
        editor.style.display = 'flex';
        editor.style.left = rect.left + 'px';
        editor.style.top = (rect.bottom + window.scrollY + 5) + 'px';
    }

    function formatTitle(cmd, val = null) {
        if (cmd === 'fontSize') document.getElementById('title-el').style.fontSize = val;
        else document.execCommand(cmd, false, val);
    }

    function applyAllSettings() {
        const area = document.getElementById('export-area');
        area.style.width = document.getElementById('wSet').value + "px";
        area.style.height = document.getElementById('hSet').value + "px";
        document.documentElement.style.setProperty('--label-size', document.getElementById('labelSizeSet').value + "px");
        document.documentElement.style.setProperty('--value-size', document.getElementById('valueSizeSet').value + "px");
        document.documentElement.style.setProperty('--accent-color', document.getElementById('colorSet').value);
        document.documentElement.style.setProperty('--accent-weight', document.getElementById('weightSet').value + "px");
        document.getElementById('title-el').style.display = document.getElementById('titleShowSet').checked ? 'block' : 'none';
        document.getElementById('orientGroup').style.display = currentType === 'bar' ? 'flex' : 'none';
        updateInputMode();
        render();
    }

    function addPoint() {
        const l = document.getElementById('labelIn');
        const valueIn = document.getElementById('valueIn');
        const percentIn = document.getElementById('percentIn');

        const input = currentType === 'pie' ? percentIn : valueIn;
        const num = parseFloat(input.value.replace(',', '.'));

        if (!l.value.trim() || isNaN(num)) return;

        if (currentType === 'pie') {
            if (num < 0 || num > 100) {
                alert('Bitte einen Prozentsatz zwischen 0 und 100 eingeben.');
                return;
            }

            const currentTotal = dataPoints.reduce((sum, p) => sum + p.value, 0);
            if (currentTotal + num > 100.000001) {
                alert('Die Summe der Prozente darf 100 % nicht überschreiten.');
                return;
            }
        }

        const groupIn = document.getElementById('groupIn');
        const group = (currentType === 'bar' && groupIn.value.trim()) ? groupIn.value.trim() : '';

        dataPoints.push({ id: Date.now(), label: l.value.trim(), value: num, group });
        l.value = "";
        input.value = "";
        l.focus();
        render();
    }

    function deletePoint(idx) {
        dataPoints.splice(idx, 1);
        render();
    }

    function sortPoints() {
        dataPoints.sort((a, b) => b.value - a.value);
        render();
    }

    function colorFor(i) {
        if (currentType === 'pie') return PALETTE[i % PALETTE.length];
        const multi = document.getElementById('multiColorSet').checked;
        return multi ? PALETTE[i % PALETTE.length] : getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();
    }

    function render() {
        const chart = document.getElementById('chart-area');

        // Alte Achsenbeschriftungen lagen als Geschwister von #chart-area
        // und wurden beim Rerender nicht von chart.innerHTML erfasst.
        document.querySelectorAll('#axis-labels').forEach(el => el.remove());

        chart.innerHTML = "";
        if (currentType === 'bar') renderBar(chart);
        else if (currentType === 'line') renderLine(chart);
        else renderPie(chart);
    }

    function addGrid(chart) {
        if (!document.getElementById('gridSet').checked) return;
        [0, 25, 50, 75].forEach(pct => {
            const g = document.createElement('div');
            g.className = 'gridline';
            g.style.bottom = pct + '%';
            chart.appendChild(g);
        });
    }

    function groupPoints(points) {
        // Gruppiert Punkte nach p.group, behält dabei die Original-Reihenfolge
        // (und damit den globalen Index für Bearbeiten/Löschen) bei.
        const map = new Map();
        points.forEach((p, i) => {
            const key = p.group && p.group.trim() ? p.group.trim() : '__default__';
            if (!map.has(key)) map.set(key, []);
            map.get(key).push({ p, i });
        });
        return map;
    }

    function renderBar(chart) {
        addGrid(chart);
        const showVal = document.getElementById('valLabelSet').checked;
        const orient = document.getElementById('orientSet').value;
        const maxVal = Math.max(...dataPoints.map(p => p.value), 1);
        const groups = groupPoints(dataPoints);
        const isGrouped = groups.size > 1;

        const barsRow = document.createElement('div');
        barsRow.id = 'bars-row';
        const axisLabels = document.createElement('div');
        axisLabels.id = 'axis-labels';
        axisLabels.className = 'axis-labels-' + orient;

        let groupIndex = 0;
        groups.forEach((entries, key) => {
            if (groupIndex > 0) {
                const divider = document.createElement('div');
                divider.className = 'group-divider';
                barsRow.appendChild(divider);

                const spacer = document.createElement('div');
                spacer.className = 'axis-divider-spacer';
                axisLabels.appendChild(spacer);
            }

            const cluster = document.createElement('div');
            cluster.className = 'bar-cluster';
            const axisCluster = document.createElement('div');
            axisCluster.className = 'axis-cluster';
            const axisRow = document.createElement('div');
            axisRow.className = 'axis-cluster-row';

            entries.forEach(({ p, i }) => {
                const col = document.createElement('div');
                col.className = 'bar-col';
                col.oncontextmenu = (e) => { e.preventDefault(); deletePoint(i); };

                const val = document.createElement('div');
                val.className = 'bar-value';
                val.contentEditable = true;
                val.style.display = showVal ? 'block' : 'none';
                val.innerText = p.value;
                val.onblur = () => { const n = parseFloat(val.innerText.replace(',', '.')); if (!isNaN(n)) { p.value = n; render(); } };

                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = ((p.value / maxVal) * 100) + '%';
                bar.style.background = colorFor(i);

                col.appendChild(val);
                col.appendChild(bar);
                cluster.appendChild(col);

                const axisCol = document.createElement('div');
                axisCol.className = 'axis-col';
                const lbl = document.createElement('div');
                lbl.className = 'axis-label';
                lbl.contentEditable = true;
                lbl.innerText = p.label;
                lbl.onblur = () => { p.label = lbl.innerText; };
                axisCol.appendChild(lbl);
                axisRow.appendChild(axisCol);
            });

            axisCluster.appendChild(axisRow);

            if (isGrouped) {
                const title = document.createElement('div');
                title.className = 'group-title';
                title.contentEditable = true;
                title.innerText = key === '__default__' ? '—' : key;
                title.onblur = () => {
                    const newKey = title.innerText.trim();
                    entries.forEach(({ p }) => { p.group = newKey; });
                };
                axisCluster.appendChild(title);
            }

            barsRow.appendChild(cluster);
            axisLabels.appendChild(axisCluster);
            groupIndex++;
        });

        chart.style.height = '400px';
        chart.appendChild(barsRow);
        let padding = orient === 'horizontal' ? 60 : 100;
        if (isGrouped) padding += 30;
        chart.parentElement.style.paddingBottom = padding + 'px';
        chart.after(axisLabels);
    }

    function renderLine(chart) {
        addGrid(chart);
        const showVal = document.getElementById('valLabelSet').checked;
        const maxVal = Math.max(...dataPoints.map(p => p.value), 1);
        const n = dataPoints.length;
        const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();
        const pad = 6;

        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.id = 'line-svg';
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('preserveAspectRatio', 'none');
        const poly = document.createElementNS(svgNS, "polyline");
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke', accent);
        poly.setAttribute('stroke-width', '2');
        poly.setAttribute('vector-effect', 'non-scaling-stroke');

        let pts = [];
        const axisLabels = document.createElement('div');
        axisLabels.id = 'axis-labels';

        dataPoints.forEach((p, i) => {
            const x = n > 1 ? pad + (i / (n - 1)) * (100 - 2 * pad) : 50;
            const y = 95 - pad - (p.value / maxVal) * (95 - 2 * pad);
            pts.push(x + ',' + y);

            const marker = document.createElement('div');
            marker.className = 'line-point';
            marker.style.left = x + '%';
            marker.style.top = y + '%';
            marker.style.borderColor = accent;
            marker.oncontextmenu = (e) => { e.preventDefault(); deletePoint(i); };
            chart.appendChild(marker);

            const val = document.createElement('div');
            val.className = 'line-value';
            val.contentEditable = true;
            val.style.display = showVal ? 'block' : 'none';
            val.style.left = x + '%';
            val.style.top = y + '%';
            val.innerText = p.value;
            val.onblur = () => { const num = parseFloat(val.innerText.replace(',', '.')); if (!isNaN(num)) { p.value = num; render(); } };
            chart.appendChild(val);

            const axisCol = document.createElement('div');
            axisCol.className = 'axis-col';
            const lbl = document.createElement('div');
            lbl.className = 'axis-label';
            lbl.contentEditable = true;
            lbl.innerText = p.label;
            lbl.onblur = () => { p.label = lbl.innerText; };
            axisCol.appendChild(lbl);
            axisLabels.appendChild(axisCol);
        });

        poly.setAttribute('points', pts.join(' '));
        svg.appendChild(poly);
        chart.style.height = '400px';
        chart.appendChild(svg);
        chart.parentElement.style.paddingBottom = '60px';
        chart.after(axisLabels);
    }

    function renderPie(chart) {
        const showVal = document.getElementById('valLabelSet').checked;
        const showInside = document.getElementById('pieInsideSet').checked;
        const total = dataPoints.reduce((s, p) => s + p.value, 0);

        const wrapper = document.createElement('div');
        wrapper.id = 'pie-wrapper';

        const pie = document.createElement('div');
        pie.id = 'pie-visual';

        const legend = document.createElement('div');
        legend.id = 'pie-legend';

        let acc = 0;
        let gradientParts = [];

        dataPoints.forEach((p, i) => {
            const start = acc;
            acc += p.value;
            const end = acc;
            const color = colorFor(i);
            gradientParts.push(`${color} ${start}% ${end}%`);

            // Wert/Prozent direkt im Kreis anzeigen (optional).
            if (showInside && p.value > 0) {
                const midAngle = ((start + end) / 2) * 3.6 - 90;
                const radius = 35;
                const x = 50 + Math.cos(midAngle * Math.PI / 180) * radius;
                const y = 50 + Math.sin(midAngle * Math.PI / 180) * radius;

                const insideValue = document.createElement('div');
                insideValue.className = 'pie-value';
                insideValue.style.left = x + '%';
                insideValue.style.top = y + '%';
                insideValue.innerText = p.value + '%';
                pie.appendChild(insideValue);
            }

            const row = document.createElement('div');
            row.className = 'legend-row';
            row.oncontextmenu = (e) => { e.preventDefault(); deletePoint(i); };

            const swatch = document.createElement('div');
            swatch.className = 'legend-swatch';
            swatch.style.background = color;

            const lbl = document.createElement('div');
            lbl.className = 'legend-label';
            lbl.contentEditable = true;
            lbl.innerText = p.label;
            lbl.onblur = () => { p.label = lbl.innerText; };

            const val = document.createElement('div');
            val.className = 'legend-value';
            val.contentEditable = true;
            val.style.display = showVal ? 'block' : 'none';
            val.innerText = p.value + '%';
            val.onblur = () => {
                const num = parseFloat(val.innerText.replace(',', '.').replace('%', ''));
                if (!isNaN(num) && num >= 0 && num <= 100) {
                    const otherTotal = total - p.value;
                    if (otherTotal + num <= 100.000001) {
                        p.value = num;
                        render();
                    }
                }
            };

            const pct = document.createElement('div');
            pct.className = 'legend-pct';
            pct.innerText = '';

            row.appendChild(swatch);
            row.appendChild(lbl);
            row.appendChild(val);
            row.appendChild(pct);
            legend.appendChild(row);
        });

        pie.style.background = dataPoints.length
            ? `conic-gradient(${gradientParts.join(', ')})`
            : '#eee';

        wrapper.appendChild(pie);
        wrapper.appendChild(legend);
        chart.style.height = '400px';
        chart.appendChild(wrapper);
        chart.parentElement.style.paddingBottom = '60px';

        const totalInfo = document.createElement('div');
        totalInfo.id = 'pie-total-info';
        if (Math.abs(total - 100) < 0.000001) {
            totalInfo.innerText = 'Summe: 100 %';
        } else if (total < 100) {
            totalInfo.innerText = `Summe: ${Number(total.toFixed(2))} % – noch ${Number((100 - total).toFixed(2))} % offen`;
        } else {
            totalInfo.innerText = `Summe: ${Number(total.toFixed(2))} %`;
        }
        chart.appendChild(totalInfo);
    }

  function downloadPDF() {
        const area = document.getElementById('export-area');
        const w = parseInt(document.getElementById('wSet').value);
        const h = parseInt(document.getElementById('hSet').value);

        html2pdf().set({
            margin: 0,
            filename: 'diagramm.pdf',
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'px', format: [w, h], orientation: 'landscape' }
        }).from(area).save();
    }

    document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('#header-editor') && !e.target.closest('#title-el')) document.getElementById('header-editor').style.display = 'none';
    });
</script>
</body>
